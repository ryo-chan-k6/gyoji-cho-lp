<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>お問い合わせ | まいにち行事カレンダー</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6F2; --ink:#4A3B36; --ink-soft:#8A7A73; --coral:#FF8FA3; --coral-deep:#F16C85;
    --card-border:#FBE4DA; --mint-deep:#5CB39E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Zen Maru Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.9;}
  header{padding:20px 24px;background:rgba(255,246,242,0.9);}
  .nav{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;}
  .logo-badge{width:26px;height:26px;background:var(--coral);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;transform:rotate(-6deg);}
  main{max-width:640px;margin:0 auto;padding:48px 24px 80px;}
  h1{font-size:24px;font-weight:900;margin-bottom:12px;}
  .lead{font-size:13.5px;color:var(--ink-soft);margin-bottom:32px;}
  .card{background:#fff;border-radius:20px;padding:32px;box-shadow:0 10px 24px -14px rgba(74,59,54,0.14);}
  label{display:block;font-size:13px;font-weight:900;margin:18px 0 8px;}
  label:first-child{margin-top:0;}
  .req{color:var(--coral-deep);font-size:11px;margin-left:4px;}
  input, select, textarea{
    width:100%;border:1.5px solid var(--card-border);border-radius:12px;padding:12px 14px;
    font-family:inherit;font-size:13.5px;color:var(--ink);background:#FFFBF9;
  }
  textarea{resize:none;height:110px;}
  .submit-btn{
    margin-top:26px;width:100%;background:#06C755;color:#fff;font-weight:900;font-size:15px;
    border:none;border-radius:100px;padding:16px;box-shadow:0 4px 0 #05A648;
  }
  .back{display:inline-block;margin-top:32px;font-size:13px;color:var(--mint-deep);font-weight:700;text-decoration:underline;}
</style>
</head>
<body>
<header><div class="nav"><span class="logo-badge">🍼</span>まいにち行事カレンダー</div></header>
<main>
  <h1>お問い合わせ</h1>
  <p class="lead">サービスに関するご質問・ご意見は、こちらのフォームよりお気軽にご連絡ください。内容を確認のうえ、順次ご返信いたします。</p>
  <div class="card">
    <label>お名前<span class="req">必須</span></label>
    <input type="text" placeholder="例）子育て 花子">
    <label>メールアドレス<span class="req">必須</span></label>
    <input type="email" placeholder="example@mail.com">
    <label>お問い合わせ種別</label>
    <select>
      <option>サービス内容について</option>
      <option>個人情報の取り扱いについて</option>
      <option>取材・提携のご相談</option>
      <option>その他</option>
    </select>
    <label>お問い合わせ内容<span class="req">必須</span></label>
    <textarea placeholder="お問い合わせ内容をご記入ください"></textarea>
    <button class="submit-btn">送信する</button>
  </div>
  <a href="index.html" class="back">← トップページに戻る</a>
</main>
</body>
</html>
